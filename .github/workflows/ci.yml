name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-macos:
    # AppKit, clang and the macOS SDK are required by the native bridge.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native bridge
        run: bun run build

      - name: Check native bridge
        run: bun run check:native -- darwin-arm64
      - name: Stage native npm package
        run: bun run stage:binaries -- darwin-arm64
      - name: Check native npm package
        run: bun run tools/check-package.ts --package @omarcos/bunkit-darwin-arm64 --require-binaries

      - name: Type-check
        run: bun run typecheck

      # Each suite runs in its own process because NSApplication is a singleton.
      - name: Test
        run: bun run test

      - name: Leak check
        run: NSZombieEnabled=YES MallocScribble=1 bun run test/soak.ts

      - name: Check npm package contents
        run: bun run check:package

      - name: Build app bundle
        run: bun run bundle examples/demo.ts --name "BunKit Demo" --id com.example.bunkitdemo

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native bridge
        run: bun run build:windows

      - name: Check native bridge
        run: bun run check:native -- win32-x64
      - name: Stage native npm package
        run: bun run stage:binaries -- win32-x64
      - name: Check native npm package
        run: bun run tools/check-package.ts --package @omarcos/bunkit-win32-x64 --require-binaries

      - name: Type-check
        run: bun run typecheck

      - name: Check npm package contents
        run: bun run check:package