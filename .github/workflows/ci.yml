name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # AppKit, clang and the macOS SDK are all required, so this only runs here.
    # macos-26 rather than macos-15: BunKit targets macOS 26, src/generated is
    # built against its SDK, and the layout tests assert against AppKit 26's
    # control metrics. macos-15 ships SDK 15.5 and fails all three.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      # Canary, not latest. BunKit is developed on Bun 1.4, which is not a
      # published release yet, and bun.lock is lockfileVersion 2 — 1.3.14 (what
      # `latest` resolves to) cannot read it and the frozen install fails.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Show toolchain
        run: |
          bun --version
          clang --version | head -2
          xcrun --show-sdk-version

      - run: bun install --frozen-lockfile

      - name: Build the bridge
        run: ./native/build.sh

      - name: Type-check
        run: bun run typecheck

      # The suites drive a real NSApplication, which needs a window server. GitHub's
      # macOS runners provide one, but there is no logged-in user to see it.
      - name: Test
        run: bun run test

      - name: Check for over-releases
        run: NSZombieEnabled=YES MallocScribble=1 bun run test/soak.ts

      - name: Build a .app
        run: bun run bundle examples/demo.ts --name "BunKit Demo" --id com.example.bunkitdemo
