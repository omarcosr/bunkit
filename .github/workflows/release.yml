name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check:native -- darwin-arm64
      - run: bun run typecheck
      - run: bun run test
      - uses: actions/upload-artifact@v4
        with:
          name: native-darwin-arm64
          path: build/libobjcbridge.dylib
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run build:windows
      - run: bun run check:native -- win32-x64
      - run: bun run typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: native-win32-x64
          path: |
            build/winbridge.dll
            build/Microsoft.WindowsAppRuntime.Bootstrap.dll
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry https://registry.npmjs.org
      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected="v$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build
          merge-multiple: true
      - run: bun run stage:binaries -- darwin-arm64
      - run: bun run stage:binaries -- win32-x64
      - run: bun run verify:release
      - run: mkdir -p release
      - run: bun pm pack --destination release
      - working-directory: packages/bunkit-darwin-arm64
        run: bun pm pack --destination ../../release
      - working-directory: packages/bunkit-win32-x64
        run: bun pm pack --destination ../../release
      - name: Publish platform packages and main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish ./release/*bunkit-darwin-arm64-*.tgz --access public
          npm publish ./release/*bunkit-win32-x64-*.tgz --access public
          npm publish ./release/*bunkit-[0-9]*.tgz --access public
